[project]
name = "catetin"
version = "0.1.0"
description = "Chat-based bookkeeping bot for Indonesian UMKM"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-telegram-bot",
    "httpx",
    "orjson",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "fpdf2",
    "pydantic",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "alembic",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catetin"]
