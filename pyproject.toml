# Workspace root — no [project] table (this is a "virtual" workspace root,
# not an installable package itself). apps/api is the sole member today;
# future Python packages under packages/ get added to `members` as they land.
#
# One shared lockfile/venv at the workspace root (this file's directory) is
# uv's design for workspaces — do NOT create a separate uv.lock/.venv inside
# apps/api. `uv run`/`uv sync` from either the repo root or apps/api resolve
# to this same root environment (uv walks up to find the workspace root).
[tool.uv.workspace]
members = ["apps/api"]
