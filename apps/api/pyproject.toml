[project]
name = "catetin"
version = "0.1.0"
description = "Chat-based bookkeeping bot for Indonesian UMKM"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-telegram-bot",
    "httpx",
    "orjson",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "fpdf2",
    "pydantic",
    "pydantic-settings",
    "pyrage>=1.4.0",
]

[dependency-groups]
dev = [
    "alembic",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pypdf>=6.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()-as-default pattern is safe despite being a function
# call in a default argument — it's re-evaluated per request, not shared
# mutable state. This is ruff's documented knob for that exact case.
extend-immutable-calls = ["fastapi.Depends"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catetin"]
