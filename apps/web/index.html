    <!--
      Applies the saved theme before first paint. This site is prerendered
      (vite-react-ssg), so the HTML ships with no .dark class; without this
      blocking script a dark-mode visitor would see a flash of the light
      canvas until React hydrates. Kept inline and dependency-free on
      purpose: it must run before the stylesheet paints.
      Precedence: localStorage -> prefers-color-scheme -> light.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("catetin-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* private mode / storage blocked: stay on the light default */
        }
      })();
    </script>
